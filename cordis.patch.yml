- insert:
    - id: weixin
      name: dsh-weixin
      config:
        tokenEnv: WEIXIN_BOT_TOKEN
        credentialPath: !!js process.env.WEIXIN_CREDENTIAL_PATH
        statePath: !!js process.env.WEIXIN_STATE_PATH
        accountId: !!js process.env.WEIXIN_BOT_ACCOUNT_ID
        apiBase: !!js process.env.WEIXIN_BOT_API_BASE
        workspace: !!js process.env.WEIXIN_DSH_WORKSPACE ?? process.cwd()
        allowedUsers: !!js (process.env.WEIXIN_ALLOWED_USERS ?? '').split(',').map(value => value.trim()).filter(Boolean)
        allowedGroups: !!js (process.env.WEIXIN_ALLOWED_GROUPS ?? '').split(',').map(value => value.trim()).filter(Boolean)
